# Gold set for the review tags, tag list v3 (§0 M3).
# Picked 100 reviews: 20 per star score (18 with a message + 2 title-only),
# random.Random(20261029), shuffled. g009 + g078 (punctuation only, now left out) were
# replaced by same-star picks with random.Random(20261030).
# The score is not shown, so tags come from the text.
# Tags filled by Claude Code on 2026-10-29 at the builder's request (not by hand):
# the builder checks them, starting with the ones that have a note.
# These reviews must never be used as prompt examples.
#
# Fill each heading. Say not_mentioned when the text says nothing about it.
# One value: delivery, price, tone. A list: product, service (not_mentioned alone).
#   delivery: on_time, late, not_delivered, not_mentioned
#   product: good, defective, wrong_or_missing, not_mentioned
#   service: good_service, seller_no_response, order_info_problem, refund_or_return, not_mentioned
#   price: good_value, too_expensive, freight_too_high, not_mentioned
#   tone: positive, neutral, negative, mixed

# v2 (2026-10-29): `other` and `delivery_failed` removed; the 7 labels that used `other`
# were re-tagged (their note starts with 'v2:').
# v3 (2026-10-29): merged to fewer values that never overlap: fast → on_time;
# damaged_or_defective, bad_quality → defective; wrong_item, missing_items, not_as_described
# → wrong_or_missing; tracking_problem, invoice_problem → order_info_problem.
