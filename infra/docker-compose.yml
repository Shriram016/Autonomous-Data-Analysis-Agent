# Local services for ADAA V3. Run from the repo root (reads the root .env):
#   docker compose -f infra/docker-compose.yml --env-file .env up -d
#   docker compose -f infra/docker-compose.yml --env-file .env ps      # all should be "healthy"
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build worker  # after a code change
#   docker compose -f infra/docker-compose.yml --env-file .env down    # data is kept in volumes
name: adaa

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped # start again after a crash or a Docker restart
    environment:
      POSTGRES_DB: ${ADAA_DB_NAME:-adaa}
      POSTGRES_USER: ${ADAA_DB_USER:-adaa_owner}
      POSTGRES_PASSWORD: ${ADAA_DB_PASSWORD:?set ADAA_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ADAA_DB_PORT:-5433}:5432" # this machine only, not the network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro # runs on first start only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"] # AOF: queued jobs survive a restart
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    # One-time job: bring the app's tables up to date (Alembic), then stop.
    # The worker (and later the API) starts only after it finished successfully.
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file: ../.env
    environment:
      ADAA_DB_HOST: postgres
      ADAA_DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    # The API (M1.5): takes questions, queues them, streams progress (SSE). Never runs the agent.
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "adaa.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    env_file: ../.env
    environment:
      ADAA_DB_HOST: postgres
      ADAA_DB_PORT: "5432"
      ADAA_REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000" # this machine only
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The slim image has no curl, so Python asks /health (200 = Postgres and Redis answer).
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    # The Celery worker (M1.4): takes questions from the Redis queue and runs the agent.
    # Runs in Linux here because Celery does not support Windows.
    build:
      context: .. # the repo root: the image needs semantic_layer/, prompts/, config/
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # -E: send task events, so Flower (below) can show running / done / failed jobs
    command: ["celery", "-A", "adaa.worker.tasks", "worker", "--loglevel=INFO", "--concurrency=2", "-E"]
    env_file: ../.env # secrets are read at run time, never stored in the image
    environment:
      # Inside Docker, 127.0.0.1 is the container itself: reach the others by service name.
      ADAA_DB_HOST: postgres
      ADAA_DB_PORT: "5432"
      ADAA_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully # tables are up to date first
    healthcheck:
      test: ["CMD-SHELL", "celery -A adaa.worker.tasks inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  flower:
    # Celery's web dashboard, local only: http://127.0.0.1:5555 (queue, running, done, failed).
    # Starts only when asked: docker compose ... --profile tools up -d flower
    image: mher/flower:2.0.1
    profiles: ["tools"]
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]
    ports:
      - "127.0.0.1:5555:5555" # this machine only
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
