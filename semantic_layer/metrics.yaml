# Metrics: the numbers the agent can compute. Every metric needs a grain (order | item | payment
# | review); see dimensions.yaml for the grain tree. Decisions: §0 M0.6 (D1 revenue = item price,
# D2 delivered orders only, as a default the question can change). Findings F1–F9: docs/data-profile.md.
version: 0.4.0

metrics:
  orders:
    label: Orders
    description: Number of orders.
    grain: item  # counted from items with DISTINCT, so item breakdowns don't double count
    table: order_items
    sql: count(DISTINCT order_items.order_id)
    filters: []
    status: default  # delivered only unless the question names a status (D2)
    unit: count
    terms: [orders, number of orders, order count]
    shown_in_answer: "Orders = distinct orders. An order with items in 2 categories counts in both."
    why: count DISTINCT keeps item breakdowns correct. (F3)

  revenue:
    label: Revenue
    description: Product sales, the sum of item prices without freight.
    grain: item
    table: order_items
    sql: sum(order_items.price)
    filters: []
    status: default  # delivered only unless the question names a status (D2)
    unit: BRL
    terms: [revenue, sales, turnover, product sales]
    shown_in_answer: "Revenue = item price, excluding freight."
    why: D1. Product sales work for every breakdown; freight goes to logistics. (F2)

  freight:
    label: Freight
    description: Shipping fees paid by customers.
    grain: item
    table: order_items
    sql: sum(order_items.freight_value)
    filters: []
    status: default  # delivered only unless the question names a status (D2)
    unit: BRL
    terms: [freight, shipping cost, shipping fees]
    shown_in_answer: "Freight = shipping fees paid by customers."
    why: Kept separate from revenue. (F2)

  total_paid:
    label: Total paid
    description: Money customers paid for whole orders.
    grain: payment  # one row per payment; an order can have several
    table: payments
    sql: sum(payments.payment_value)
    filters: []
    status: default  # delivered only unless the question names a status (D2)
    unit: BRL
    terms: [total paid, amount paid, payment value]
    shown_in_answer: "Total paid = payment value for whole orders."
    why: Equals price + freight for 99.7% of orders; cannot split by category or seller. (F2)

  average_order_value:
    label: Average order value
    description: Revenue per order.
    grain: order
    table: order_items
    sql: sum(order_items.price) / count(DISTINCT order_items.order_id)
    filters: []
    status: default  # delivered only unless the question names a status (D2)
    unit: BRL
    support:  # an average: only the whole, "based on N orders"
      whole_sql: count(DISTINCT order_items.order_id)
      whole_label: orders
    terms: [average order value, aov, basket size]
    shown_in_answer: "Average order value = revenue per order."
    why: Uses the revenue definition, so the two never disagree. (F2)

  customers:
    label: Customers
    description: Distinct people with an order.
    grain: item  # DISTINCT people, so item breakdowns don't double count
    table: order_items
    sql: count(DISTINCT customers.customer_unique_id)
    filters: []
    status: default  # delivered only unless the question names a status (D2)
    unit: count
    terms: [customers, buyers, number of customers]
    shown_in_answer: "Customers = distinct people (customer_unique_id), not customer IDs."
    why: One person can have several customer_id values. (F4)

  late_delivery_rate:
    label: Late-delivery rate
    description: Share of delivered orders that arrived after the estimated date.
    grain: order
    table: orders
    sql: avg((orders.order_delivered_customer_date::date > orders.order_estimated_delivery_date::date)::int)
    filters:
      - "orders.order_status = 'delivered'"
      - "orders.order_delivered_customer_date IS NOT NULL"
    status: built_in  # needs a delivery date, so delivered only, always
    unit: ratio
    support:  # the counts shown next to the rate
      part_sql: count(*) FILTER (WHERE orders.order_delivered_customer_date::date > orders.order_estimated_delivery_date::date)
      whole_sql: count(*)
      part_label: late
      whole_label: delivered orders
    terms: [late delivery rate, late deliveries, delays]
    shown_in_answer: "Late = delivered after the estimated date (by day), delivered orders only."
    why: The estimate is a date, so the compare is by day. (F7)

  average_delivery_days:
    label: Average delivery days
    description: Days from purchase to delivery.
    grain: order
    table: orders
    sql: avg(orders.order_delivered_customer_date::date - orders.order_purchase_timestamp::date)
    filters:
      - "orders.order_status = 'delivered'"
      - "orders.order_delivered_customer_date IS NOT NULL"
    status: built_in  # needs a delivery date, so delivered only, always
    unit: days
    support:
      whole_sql: count(*)
      whole_label: delivered orders
    terms: [delivery time, days to deliver, shipping time]
    shown_in_answer: "Delivery days = purchase date to delivery date, delivered orders only."
    why: (F7)

  average_review_score:
    label: Average review score
    description: Average of review scores from 1 to 5.
    grain: review
    table: reviews
    sql: avg(reviews.review_score)
    filters: []
    unit: score  # an average from 1 to 5
    support:
      whole_sql: count(*)
      whole_label: reviews
    terms: [review score, rating, satisfaction]
    shown_in_answer: "Average of review scores (1 to 5). An order with 2 reviews counts twice."
    why: review_id repeats; a review is a (review_id, order_id) row. No status filter. (F5)

  review_count:
    label: Reviews
    description: Number of review rows.
    grain: review
    table: reviews
    sql: count(*)
    filters: []
    unit: count
    terms: [reviews, number of reviews, review count]
    shown_in_answer: "Reviews = review rows (review_id, order_id)."
    why: (F5)

  # --- added in v0.4.0 (M2 step 1) ---

  items_sold:
    label: Items sold
    description: Number of items sold (one order can have several items).
    grain: item
    table: order_items
    sql: count(*)
    filters: []
    status: default  # delivered only unless the question names a status (D2)
    unit: count
    terms: [items sold, units sold, number of items]
    shown_in_answer: "Items sold = order item rows (2 units of one product = 2 items)."
    why: One row in order_items is one unit; orders counts orders, this counts units.

  active_sellers:
    label: Active sellers
    description: Number of distinct sellers with at least one sale.
    grain: item  # DISTINCT sellers, so item breakdowns don't double count
    table: order_items
    sql: count(DISTINCT order_items.seller_id)
    filters: []
    status: default  # delivered only unless the question names a status (D2)
    unit: count
    terms: [active sellers, number of sellers, seller count]
    shown_in_answer: "Active sellers = distinct sellers with a sale in the period."
    why: A seller with no sale in the period is not counted.

  cancellation_rate:
    label: Cancellation rate
    description: Share of all orders that were canceled.
    grain: order
    table: orders
    sql: avg((orders.order_status = 'canceled')::int)
    filters: []
    status: all  # a share of every order, so no delivered-only default
    unit: ratio
    support:
      part_sql: count(*) FILTER (WHERE orders.order_status = 'canceled')
      whole_sql: count(*)
      part_label: canceled
      whole_label: orders
    terms: [cancellation rate, cancellations, canceled share]
    shown_in_answer: "Cancellation rate = canceled orders / all orders (every status)."
    why: Delivered only would make it 0. 'unavailable' is not counted as canceled. (F3)

  low_review_rate:
    label: Low-review rate
    description: Share of reviews with a score of 1 or 2.
    grain: review
    table: reviews
    sql: avg((reviews.review_score <= 2)::int)
    filters: []
    unit: ratio
    support:
      part_sql: count(*) FILTER (WHERE reviews.review_score <= 2)
      whole_sql: count(*)
      part_label: with 1 or 2 stars
      whole_label: reviews
    terms: [low review rate, bad reviews, unhappy customers]
    shown_in_answer: "Low-review rate = reviews with score 1 or 2 / all reviews."
    why: A share is easier to compare than an average score. No status filter. (F5)

  repeat_customer_rate:
    label: Repeat-customer rate
    description: Share of customers with 2 or more orders in the period.
    grain: order  # one person, several categories: so no item breakdowns
    table: orders
    per: customers.customer_unique_id  # step 1: one row per person
    per_sql: count(DISTINCT orders.order_id)  # that person's orders
    sql: avg((per_value >= 2)::int)  # step 2: share of people with 2+
    filters: []
    status: default  # delivered only unless the question names a status (D2)
    unit: ratio
    support:
      part_sql: count(*) FILTER (WHERE per_value >= 2)  # over the per-person rows
      whole_sql: count(*)
      part_label: with 2+ orders
      whole_label: people
    terms: [repeat customer rate, repeat customers, returning customers]
    shown_in_answer: "Repeat-customer rate = people with 2+ orders in the period / all people with an order in the period."
    why: >
      Counts only orders inside the question's period and filters, like every other metric.
      By month it is lower (most months about 1%): few people order twice in one month.
      Correct, not a bug. (F4)
