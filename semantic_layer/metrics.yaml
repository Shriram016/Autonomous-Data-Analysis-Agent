# Metrics: the numbers the agent can compute. Every metric needs a grain (order | item | payment
# | review); see dimensions.yaml for the grain tree. Decisions: §0 M0.6 (D1 revenue = item price,
# D2 delivered orders only). Findings F1–F9: docs/data-profile.md.
version: 0.2.0

metrics:
  orders:
    label: Orders
    description: Number of delivered orders.
    grain: item  # counted from items with DISTINCT, so item breakdowns don't double count
    table: order_items
    sql: count(DISTINCT order_items.order_id)
    filters: ["orders.order_status = 'delivered'"]
    terms: [orders, number of orders, order count]
    shown_in_answer: "Orders = delivered orders. An order with items in 2 categories counts in both."
    why: count DISTINCT keeps item breakdowns correct. (F3)

  revenue:
    label: Revenue
    description: Product sales, the sum of item prices without freight.
    grain: item
    table: order_items
    sql: sum(order_items.price)
    filters: ["orders.order_status = 'delivered'"]
    unit: BRL
    terms: [revenue, sales, turnover, product sales]
    shown_in_answer: "Revenue = item price, excluding freight, delivered orders only."
    why: D1. Product sales work for every breakdown; freight goes to logistics. (F2)

  freight:
    label: Freight
    description: Shipping fees paid by customers.
    grain: item
    table: order_items
    sql: sum(order_items.freight_value)
    filters: ["orders.order_status = 'delivered'"]
    unit: BRL
    terms: [freight, shipping cost, shipping fees]
    shown_in_answer: "Freight = shipping fees on delivered orders."
    why: Kept separate from revenue. (F2)

  total_paid:
    label: Total paid
    description: Money customers paid for whole orders.
    grain: payment  # one row per payment; an order can have several
    table: payments
    sql: sum(payments.payment_value)
    filters: ["orders.order_status = 'delivered'"]
    unit: BRL
    terms: [total paid, amount paid, payment value]
    shown_in_answer: "Total paid = payment value of delivered orders, for whole orders."
    why: Equals price + freight for 99.7% of orders; cannot split by category or seller. (F2)

  average_order_value:
    label: Average order value
    description: Revenue per delivered order.
    grain: order
    table: order_items
    sql: sum(order_items.price) / count(DISTINCT order_items.order_id)
    filters: ["orders.order_status = 'delivered'"]
    unit: BRL
    terms: [average order value, aov, basket size]
    shown_in_answer: "Average order value = revenue per delivered order."
    why: Uses the revenue definition, so the two never disagree. (F2)

  customers:
    label: Customers
    description: Distinct people with a delivered order.
    grain: item  # DISTINCT people, so item breakdowns don't double count
    table: order_items
    sql: count(DISTINCT customers.customer_unique_id)
    filters: ["orders.order_status = 'delivered'"]
    terms: [customers, buyers, number of customers]
    shown_in_answer: "Customers = distinct people (customer_unique_id), not customer IDs."
    why: One person can have several customer_id values. (F4)

  late_delivery_rate:
    label: Late-delivery rate
    description: Share of delivered orders that arrived after the estimated date.
    grain: order
    table: orders
    sql: avg((orders.order_delivered_customer_date::date > orders.order_estimated_delivery_date::date)::int)
    filters:
      - "orders.order_status = 'delivered'"
      - "orders.order_delivered_customer_date IS NOT NULL"
    unit: ratio
    terms: [late delivery rate, late deliveries, delays]
    shown_in_answer: "Late = delivered after the estimated date (by day), delivered orders only."
    why: The estimate is a date, so the compare is by day. (F7)

  average_delivery_days:
    label: Average delivery days
    description: Days from purchase to delivery.
    grain: order
    table: orders
    sql: avg(orders.order_delivered_customer_date::date - orders.order_purchase_timestamp::date)
    filters:
      - "orders.order_status = 'delivered'"
      - "orders.order_delivered_customer_date IS NOT NULL"
    unit: days
    terms: [delivery time, days to deliver, shipping time]
    shown_in_answer: "Delivery days = purchase date to delivery date, delivered orders only."
    why: (F7)

  average_review_score:
    label: Average review score
    description: Average of review scores from 1 to 5.
    grain: review
    table: reviews
    sql: avg(reviews.review_score)
    filters: []
    terms: [review score, rating, satisfaction]
    shown_in_answer: "Average of review scores (1 to 5). An order with 2 reviews counts twice."
    why: review_id repeats; a review is a (review_id, order_id) row. No status filter. (F5)

  review_count:
    label: Reviews
    description: Number of review rows.
    grain: review
    table: reviews
    sql: count(*)
    filters: []
    terms: [reviews, number of reviews, review count]
    shown_in_answer: "Reviews = review rows (review_id, order_id)."
    why: (F5)
