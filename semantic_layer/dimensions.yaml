# Dimensions: the ways a metric can be broken down.
#
# Grain tree:          order       (state, month, status)
#                   /    |    \
#                item  payment  review
# A metric can use a dimension at its own grain or at "order" (above it in the tree).
# Example: revenue (item) can use category (item) and state (order), not payment type (payment).
# A metric that counts DISTINCT ids (orders, customers) can use any dimension it can reach.
# Time dimensions use {date}: the counted metric's own date (v0.5.0: reviews by review date).
version: 0.5.0

dimensions:
  month:
    label: Month
    grain: order
    sql: date_trunc('month', {date})
    terms: [month, monthly, per month]
    kind: time  # a breakdown with no sort is shown oldest first (a trend)
    why: "The metric's own date (orders, items, payments: purchase date; reviews: review date). Thin months outside 2017-01..2018-08. (F1)"

  year:
    label: Year
    grain: order
    sql: extract(year FROM {date})
    terms: [year, yearly, annual]
    kind: time

  quarter:
    label: Quarter
    grain: order
    sql: to_char({date}, 'YYYY-"Q"Q')
    terms: [quarter, quarterly, per quarter]
    kind: time
    why: Text like 2017-Q3, so it sorts by date. Calendar quarters (added v0.4.0).

  customer_state:
    label: Customer state
    grain: order
    sql: customers.customer_state
    terms: [state, customer state, region]
    value_labels: &brazil_states  # code → name, so "Pará" is PA and "Paris" is not
      AC: Acre
      AL: Alagoas
      AM: Amazonas
      AP: Amapá
      BA: Bahia
      CE: Ceará
      DF: Distrito Federal
      ES: Espírito Santo
      GO: Goiás
      MA: Maranhão
      MG: Minas Gerais
      MS: Mato Grosso do Sul
      MT: Mato Grosso
      PA: Pará
      PB: Paraíba
      PE: Pernambuco
      PI: Piauí
      PR: Paraná
      RJ: Rio de Janeiro
      RN: Rio Grande do Norte
      RO: Rondônia
      RR: Roraima
      RS: Rio Grande do Sul
      SC: Santa Catarina
      SE: Sergipe
      SP: São Paulo
      TO: Tocantins

  order_status:
    label: Order status
    grain: order
    sql: orders.order_status
    terms: [status, order status]
    why: Lets a manager see orders that are not delivered (overrides D2).

  product_category:
    label: Product category
    grain: item
    sql: coalesce(category_translation.product_category_name_english, products.product_category_name, 'unknown')
    terms: [category, product category, product type]
    why: English name; Portuguese if not translated; 'unknown' if empty. (F8)

  seller_state:
    label: Seller state
    grain: item
    sql: sellers.seller_state
    terms: [seller state, seller location]
    value_labels: *brazil_states  # the same 27 names, written once

  seller:
    label: Seller
    grain: item
    sql: order_items.seller_id
    terms: [seller, vendor, merchant]

  payment_type:
    label: Payment type
    grain: payment
    sql: payments.payment_type
    terms: [payment type, payment method]
    why: One order can use 2 payment types, so only payment metrics can use it.

  review_score:
    label: Review score
    grain: review
    sql: reviews.review_score
    terms: [score, stars, review stars]
