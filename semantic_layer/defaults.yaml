# Default meanings for vague words and missing details. Each default is stated in the answer,
# with an offer to switch (§0: assume only when a default is written down; otherwise ask).
version: 0.3.2

defaults:
  default_status_filter:
    means: "orders.order_status = 'delivered'"
    shown_in_answer: "Delivered orders only."
    why: D2. Final sales; delivery metrics need a delivery date anyway.

  default_period:
    means: all available data
    shown_in_answer: "Period: all available data (no period was asked for)."
    why: >
      A question with no period means everything; a smaller default would quietly change totals
      (changed 2026-10-20 from 2017-01..2018-08). Thin months are flagged instead. (F1)

  thin_month:
    means: "500"
    shown_in_answer: "Data as of the last month with at least 500 orders."
    why: >
      Sets the data date (the agent's "today"): the first and last months have 1 to 324
      orders, so they don't count as full months. No thin-month note in answers (2026-10-22).

  best_customer:
    terms: [best customers, top customers, most valuable customers]
    means: customers ranked by revenue
    shown_in_answer: "Assuming best = highest revenue. Switch to most orders?"

  best_seller:
    terms: [best sellers, top sellers]
    means: sellers ranked by revenue
    shown_in_answer: "Assuming best = highest revenue. Switch to lowest late-delivery rate?"

  customer_identity:
    means: customers.customer_unique_id
    shown_in_answer: "One customer = one person (customer_unique_id)."
    why: One person can have several customer_id values. (F4)
