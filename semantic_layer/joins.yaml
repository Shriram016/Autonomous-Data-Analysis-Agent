# How the tables connect. Every join goes from the "many" side to the "one" side, so following
# a join never multiplies rows. optional: true means LEFT JOIN (keep rows with no match, F8).
# The key is "condition", not "on": YAML reads a bare `on` as the boolean true.
version: 0.3.0

joins:
  - { from: order_items, to: orders, condition: order_items.order_id = orders.order_id }
  - { from: order_items, to: products, condition: order_items.product_id = products.product_id }
  - { from: order_items, to: sellers, condition: order_items.seller_id = sellers.seller_id }
  - from: products
    to: category_translation
    condition: products.product_category_name = category_translation.product_category_name
    optional: true
  - { from: payments, to: orders, condition: payments.order_id = orders.order_id }
  - { from: reviews, to: orders, condition: reviews.order_id = orders.order_id }
  - { from: orders, to: customers, condition: orders.customer_id = customers.customer_id }
