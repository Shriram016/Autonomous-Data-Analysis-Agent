# Layered checks: fast ones run more often.
#   pre-commit (every commit): ruff lint + format, mypy
#   pre-push   (every push):   unit tests
#   CI         (GitHub):       everything, incl. integration tests
# Install once from the repo root:
#   uv run --project backend pre-commit install --hook-type pre-commit --hook-type pre-push
# Uses the project's own tools (pinned in backend/uv.lock), so versions never disagree.
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --project backend ruff check --fix
        language: system
        types: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format
        language: system
        types: [python]
        files: ^backend/
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
      - id: unit-tests
        name: unit tests
        entry: bash -c 'cd backend && uv run pytest tests/unit -q'
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
        stages: [pre-push]
