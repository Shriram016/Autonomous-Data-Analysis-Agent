# LLM settings: which model each job uses, and how (ADR 0009, §0 M1.2).
#
# Change a model or turn thinking on here; no code changes. Loaded and checked by
# backend/src/adaa/llm/config.py, which refuses to load if a name or value is wrong.
#
# Three parts, so each fact lives in one place:
#   providers — how to reach a company (adapter + the NAME of its key in .env)
#   models    — each model, its provider and its price
#   jobs      — each thing the app asks an LLM to do

version: 0.1.0

providers:
  anthropic:
    adapter: anthropic
    api_key_env: ANTHROPIC_API_KEY  # the name of the variable in .env, never the key itself
  openrouter:
    adapter: jev  # TypeSafe's Jev classifier through OpenRouter's decisions API (alpha)
    api_key_env: OPENROUTER_API_KEY

models:
  claude-haiku-5-5:
    provider: anthropic
    # USD per 1M tokens. Thinking tokens are billed at the output price.
    # This is the price for prompts up to 100K tokens; above that it is 5x. Our prompts
    # are ~3K tokens. Every call stores its token counts, so cost can be recomputed
    # if this price goes stale (§0, Cost).
    price_per_million:
      input: 0.10
      output: 0.50
    price_checked: 2026-10-20

  typesafe/jev-1.14:  # pinned version; ~typesafe/jev-latest would change under us
    provider: openrouter
    price_per_million:
      input: 0.042
      output: 0.0  # a choice answer: output is free
    price_checked: 2026-10-26

# The router (M2 step 2): the jobs tried in order. First = primary, the rest = fallbacks.
# One line changes the primary ([route_haiku, route_jev]) or drops Jev ([route_haiku]).
# Every option fails → the question goes to the numbers route (the M1 behaviour).
router:
  order: [route_jev, route_haiku]

jobs:
  route_jev:  # question → route, with a confidence (Jev picks one choice)
    model: typesafe/jev-1.14
    timeout_seconds: 5  # a classifier: fast, or fall back

  reply:  # quick routes (clarify, refuse, metadata) → that route's form (M2 step 2c)
    model: claude-haiku-5-5
    thinking: disabled
    max_tokens: 400  # a short message and 1–3 suggestion questions
    timeout_seconds: 15
    max_attempts: 1  # no retry: a code-made fallback reply is shown, and the failure logged

  route_haiku:  # question → route (fallback); no confidence
    model: claude-haiku-5-5
    thinking: disabled
    max_tokens: 100  # one short field
    timeout_seconds: 10
    max_attempts: 1  # no retry: the next option, or the numbers route, is the fallback

  agent:  # English question → structured request form (M1.3)
    model: claude-haiku-5-5
    # disabled / low / medium / high. Not "off": YAML reads a bare `off` as false.
    # Start disabled; turn on when evals show failures, and measure if it helps (§0 M1.2).
    thinking: disabled
    max_tokens: 2000  # hard cap on output; thinking tokens count toward it
    timeout_seconds: 30
    # 1 or 2. Retry only where a failure blocks the result (§0 M1.3): no valid form means
    # no answer, so one retry with the errors is worth it.
    max_attempts: 2

  answer:  # rows → 1-3 sentences (M1.3)
    model: claude-haiku-5-5
    thinking: disabled
    max_tokens: 500  # a short answer needs few tokens
    timeout_seconds: 30
    # No retry: any bad reply (wrong form, or a number not in the data) goes straight to
    # the template answer made by code, and the failure is logged.
    max_attempts: 1
    max_rows: 20  # at most this many data rows are sent to the LLM ("top 20 of N")
