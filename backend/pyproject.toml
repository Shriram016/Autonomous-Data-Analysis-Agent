[project]
name = "adaa"
version = "0.1.0"
description = "ADAA V3 backend: API, workers and the LangGraph agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=1.17.0",
    "celery>=5.6.3",
    "langgraph>=1.2.16",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0.12.20260906",
    "celery-types>=0.26.0",
]

[tool.uv]
# uv's cache is on C: and the project on E:, so files are copied instead of hard-linked.
link-mode = "copy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaa"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors · I: import order · B: likely bugs · UP: modern syntax · SIM: simpler code
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "dev_checks"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs running Postgres/Redis (docker compose)"]
