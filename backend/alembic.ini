# Alembic: versioned changes to the app's own tables (§0 M1.5).
#
#   uv run alembic upgrade head      # apply every missing migration, in order
#   uv run alembic current           # which migration this database has
#   uv run alembic downgrade -1      # undo the last one
#
# The database connection comes from .env (migrations/env.py), never from this file.

[alembic]
script_location = %(here)s/migrations
